name: Registro público seguro
on: [pull_request]
permissions:
  contents: read
jobs:
  registro:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: node --test tests/public-registration.test.cjs
